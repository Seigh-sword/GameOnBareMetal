name: Build bootable image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils gcc-multilib python3 xorriso qemu-system-x86
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Test boot and Rust-backed GmStg disk driver
        run: |
          mkdir -p build
          python3 tools/gmstg.py create build/storage-test.img
          printf HELLO > build/test.wad
          python3 tools/gmstg.py put build/storage-test.img build/test.wad
          python3 tests/add_high_entry.py build/storage-test.img
          make test iso RUST=1 VIDEO=text GAME_SRC=tests/storage_boot.c
          python3 tests/test_boot.py build/game.img
          python3 tests/test_boot.py build/game.iso
      - name: Test packaged game execution in QEMU
        run: |
          make sample-cxg RUST=1
          python3 tools/gmstg.py put build/storage-test.img build/game.cxg.meta
          make iso RUST=1 VIDEO=text GAME_SRC=tests/package_boot.c
          python3 tests/test_boot.py build/game.img CXG
          python3 tests/test_boot.py build/game.iso CXG
      - name: Test graphics demo
        run: make test RUST=1 VIDEO=graphics GAME_SRC=games/triangle.c
      - name: Build game hub
        run: make test iso RUST=1 VIDEO=text GAME_SRC=games/hub.c
      - name: Upload IMG
        uses: actions/upload-artifact@v4
        with:
          name: GameOnBareMetal-IMG
          path: build/game.img
          if-no-files-found: error
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: GameOnBareMetal-ISO
          path: build/game.iso
          if-no-files-found: error
