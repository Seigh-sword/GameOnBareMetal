name: Build bootable image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils gcc-multilib python3
      - name: Build and check image
        run: make test
      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: GameOnBareMetal-image
          path: build/game.img
          if-no-files-found: error
